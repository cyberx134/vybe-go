# Android APK তৈরি (সম্পূর্ণ ফ্রি — GitHub Actions এ)।
# চালানোর উপায়: GitHub → Actions → "Android APK" → Run workflow, অথবা  git tag v1.0.0 && git push --tags
# Repository Secrets লাগবে: SUPABASE_URL, SUPABASE_ANON_KEY
name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install dependencies
        run: npm install
      - name: Align Expo package versions
        working-directory: apps/mobile
        run: npx expo install --fix
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vybe-go-apk
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
